[project]
name = "neuromorphic-avoidance"
version = "0.1.0"
description = "Event-based obstacle avoidance in MuJoCo"
requires-python = ">=3.10,<3.13"
dependencies = ["mujoco>=3.3,<4", "numpy>=2,<3", "Pillow>=11,<13"]

[project.scripts]
check-environment = "neuroavoid.check_environment:main"
drive-robot = "neuroavoid.manual:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroavoid"]
